<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Stainless steel pipes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a303a"/><stop offset="0.62" stop-color="#3a414d"/>
      <stop offset="0.62" stop-color="#555d69"/><stop offset="1" stop-color="#2b3039"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f6973"/><stop offset="0.2" stop-color="#eef2f5"/>
      <stop offset="0.38" stop-color="#bcc5cd"/><stop offset="0.72" stop-color="#7b858f"/><stop offset="1" stop-color="#394047"/>
    </linearGradient>
    <radialGradient id="ring" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#f6f8fa"/><stop offset="0.7" stop-color="#bac3cb"/><stop offset="1" stop-color="#7e8892"/>
    </radialGradient>
    <linearGradient id="bore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2025"/><stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <ellipse cx="310" cy="338" rx="270" ry="26" fill="url(#shadow)"/>
  <!-- bottom pipe left -->
  <g>
    <rect x="50" y="244" width="430" height="84" fill="url(#cyl)"/>
    <ellipse cx="480" cy="286" rx="20" ry="42" fill="url(#ring)"/>
    <ellipse cx="480" cy="286" rx="14" ry="33" fill="url(#bore)"/>
    <ellipse cx="480" cy="286" rx="20" ry="42" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
    <line x1="60" y1="262" x2="470" y2="262" stroke="#fff" stroke-width="3" opacity="0.6" filter="url(#soft)"/>
  </g>
  <!-- middle pipe -->
  <g>
    <rect x="70" y="160" width="450" height="84" fill="url(#cyl)"/>
    <ellipse cx="520" cy="202" rx="20" ry="42" fill="url(#ring)"/>
    <ellipse cx="520" cy="202" rx="14" ry="33" fill="url(#bore)"/>
    <ellipse cx="520" cy="202" rx="20" ry="42" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
    <line x1="80" y1="178" x2="510" y2="178" stroke="#fff" stroke-width="3" opacity="0.6" filter="url(#soft)"/>
    <!-- weld seam -->
    <line x1="80" y1="218" x2="505" y2="218" stroke="#5c656e" stroke-width="2" opacity="0.7"/>
    <line x1="80" y1="220" x2="505" y2="220" stroke="#fff" stroke-width="1" opacity="0.35"/>
  </g>
  <!-- top pipe -->
  <g>
    <rect x="90" y="76" width="430" height="84" fill="url(#cyl)"/>
    <ellipse cx="520" cy="118" rx="20" ry="42" fill="url(#ring)"/>
    <ellipse cx="520" cy="118" rx="14" ry="33" fill="url(#bore)"/>
    <ellipse cx="520" cy="118" rx="20" ry="42" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
    <line x1="100" y1="94" x2="510" y2="94" stroke="#fff" stroke-width="3" opacity="0.6" filter="url(#soft)"/>
  </g>
  <!-- end caps / spec band -->
  <g opacity="0.9">
    <rect x="150" y="76" width="8" height="84" fill="#c9a84c" opacity="0.8"/>
    <rect x="130" y="160" width="8" height="84" fill="#c9a84c" opacity="0.8"/>
    <rect x="110" y="244" width="8" height="84" fill="#c9a84c" opacity="0.8"/>
  </g>
  <!-- shadow separation lines -->
  <g stroke="#0d1013" stroke-width="2" opacity="0.5">
    <line x1="90" y1="160" x2="500" y2="160"/><line x1="70" y1="244" x2="460" y2="244"/>
  </g>
</svg>
