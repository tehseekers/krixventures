<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Stainless steel coil">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a303a"/><stop offset="0.62" stop-color="#3a414d"/>
      <stop offset="0.62" stop-color="#555d69"/><stop offset="1" stop-color="#2b3039"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/><stop offset="0.18" stop-color="#cfd6dd"/>
      <stop offset="0.45" stop-color="#8f99a4"/><stop offset="0.7" stop-color="#d3d9df"/>
      <stop offset="0.88" stop-color="#7a848e"/><stop offset="1" stop-color="#4a525b"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.25"/><stop offset="0.25" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.38"/>
    </linearGradient>
    <radialGradient id="face" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#eef2f5"/><stop offset="0.5" stop-color="#b4bcc5"/><stop offset="1" stop-color="#7c8691"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#0b0d10"/>
    </radialGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a929b"/><stop offset="0.5" stop-color="#3c4249"/><stop offset="1" stop-color="#1e2227"/>
    </linearGradient>
    <pattern id="brush" width="8" height="3" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" fill="#fff" opacity="0.16"/><rect y="2" width="8" height="0.6" fill="#000" opacity="0.1"/>
    </pattern>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.6"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <ellipse cx="320" cy="338" rx="260" ry="26" fill="url(#shadow)"/>
  <!-- coil body -->
  <path d="M190 62 L410 62 A62 128 0 0 1 410 318 L190 318 Z" fill="url(#body)"/>
  <path d="M190 62 L410 62 A62 128 0 0 1 410 318 L190 318 Z" fill="url(#brush)"/>
  <path d="M190 62 L410 62 A62 128 0 0 1 410 318 L190 318 Z" fill="url(#shade)"/>
  <!-- straps -->
  <g>
    <rect x="256" y="60" width="12" height="260" fill="url(#strap)" opacity="0.95"/>
    <rect x="344" y="60" width="12" height="260" fill="url(#strap)" opacity="0.95"/>
    <rect x="254" y="176" width="16" height="26" rx="2" fill="#2a2f35"/>
    <rect x="342" y="176" width="16" height="26" rx="2" fill="#2a2f35"/>
  </g>
  <!-- front face with wound layers -->
  <ellipse cx="190" cy="190" rx="62" ry="128" fill="url(#face)"/>
  <g fill="none" stroke-width="1.4">
    <ellipse cx="190" cy="190" rx="58" ry="119" stroke="#fff" opacity="0.55"/>
    <ellipse cx="190" cy="190" rx="52" ry="107" stroke="#59626c" opacity="0.5"/>
    <ellipse cx="190" cy="190" rx="46" ry="95" stroke="#fff" opacity="0.5"/>
    <ellipse cx="190" cy="190" rx="40" ry="83" stroke="#59626c" opacity="0.5"/>
    <ellipse cx="190" cy="190" rx="34" ry="71" stroke="#fff" opacity="0.45"/>
    <ellipse cx="190" cy="190" rx="29" ry="60" stroke="#59626c" opacity="0.55"/>
  </g>
  <ellipse cx="190" cy="190" rx="62" ry="128" fill="none" stroke="#e9eef2" stroke-width="2.5" opacity="0.8"/>
  <ellipse cx="190" cy="190" rx="24" ry="50" fill="url(#eye)"/>
  <path d="M174 176 Q190 158 206 176" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.18"/>
  <!-- specular highlight -->
  <path d="M215 72 L395 72" stroke="#fff" stroke-width="5" opacity="0.65" filter="url(#soft)"/>
  <path d="M215 296 L395 296" stroke="#fff" stroke-width="3" opacity="0.2" filter="url(#soft)"/>
  <!-- ID tag -->
  <rect x="285" y="215" width="42" height="26" rx="2" fill="#f1f1ec" opacity="0.92"/>
  <g fill="#6b7280"><rect x="290" y="221" width="26" height="2.5"/><rect x="290" y="227" width="32" height="2.5"/><rect x="290" y="233" width="18" height="2.5"/></g>
</svg>
